<!DOCTYPE html>
<html>

<head>

<title>Edit Hourly Attendance</title>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";

import {
getDatabase,
ref,
get,
update
}
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";


const firebaseConfig = {

apiKey: "AIzaSyCLdqMLxR9ZKEeS6zDHv-rkbSt-PTbDtMc",

databaseURL:
"https://attendance-tracker-7256b-default-rtdb.firebaseio.com"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const sem =
localStorage.getItem("currentSem");


let timetable = {};

let attendance = {};

let placement = {};

let edits = {};



/* load all data */

async function loadBase(){

let t =
await get(
ref(db,
"semesters/"+sem+"/timetable")
);

timetable = t.val() || {};


let a =
await get(
ref(db,
"semesters/"+sem+"/attendance")
);

attendance = a.val() || {};


let p =
await get(
ref(db,
"semesters/"+sem+"/placement")
);

placement = p.val() || {};

}

loadBase();



/* load date range */

window.loadDates = function(){

let from =
document.getElementById("from").value;

let to =
document.getElementById("to").value;


if(!from || !to){

alert("Select date");

return;

}


let start =
new Date(from);

let end =
new Date(to);


let html="";


while(start<=end){

let date =
start.toISOString().split("T")[0];


/* check placement */

if(placement[date]){


html+=`

<div class="dayBox placement">

<div class="date">

${date}

</div>

<div class="placementTag">

PLACEMENT

</div>

</div>

`;


start.setDate(start.getDate()+1);

continue;

}


/* normal hourly */

let day =
new Date(date)
.toLocaleDateString(
'en-US',
{weekday:'long'}
);


let subjects =
timetable[day] || [];


html+=`

<div class="dayBox">

<div class="date">

${date}

</div>

`;


subjects.forEach((sub,i)=>{


if(sub!="break" && sub!="lunch"){


let saved =
attendance[date]?.hourly?.["period"+i] || "";


html+=`

<div class="row">

<span class="sub">

${sub}

</span>


<div class="btns">

<button

class="p ${
saved=="present"?"active":""
}"

onclick="markHour('${date}',${i},'present')">

P

</button>


<button

class="a ${
saved=="absent"?"active":""
}"

onclick="markHour('${date}',${i},'absent')">

A

</button>

</div>

</div>

`;

}


});


html+=`

</div>

`;


start.setDate(start.getDate()+1);

}


document.getElementById("list")
.innerHTML = html;

};



/* mark attendance */

window.markHour=function(date,i,status){

if(!edits[date]){

edits[date]={};

}


if(!edits[date].hourly){

edits[date].hourly={};

}


edits[date].hourly["period"+i]=status;


loadDates();

};



/* update safely */

window.updateServer = async function(){

for(let date in edits){

let snap =
await get(
ref(db,
"semesters/"+sem+
"/attendance/"+date)
);


let existing =
snap.val() || {};


let merged = {

...existing,

hourly:{

...(existing.hourly || {}),

...(edits[date].hourly || {})

}

};


await update(

ref(db,
"semesters/"+sem+
"/attendance/"+date),

merged

);

}


alert("Updated successfully");

};

</script>



<style>

body{

margin:0;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

font-family:Segoe UI;

background:

linear-gradient(
rgba(70,0,120,0.8),
rgba(30,0,80,0.9)
),

url("https://images.unsplash.com/photo-1506744038136-46273834b3fb");

background-size:cover;

}



/* container */

.container{

width:420px;

height:560px;

padding:20px;

border-radius:20px;

background:rgba(255,255,255,0.1);

backdrop-filter:blur(15px);

display:flex;

flex-direction:column;

color:white;

}



/* header */

.header{

margin-bottom:10px;

}



input{

padding:6px;

border:none;

border-radius:10px;

}



/* list */

.list{

overflow:auto;

flex:1;

}



/* day */

.dayBox{

background:rgba(255,255,255,0.08);

padding:10px;

margin-bottom:10px;

border-radius:10px;

}



/* placement box */

.placement{

display:flex;

justify-content:space-between;

align-items:center;

background:rgba(255,200,0,0.15);

}



/* placement label */

.placementTag{

background:#eab308;

color:black;

padding:5px 10px;

border-radius:8px;

font-size:12px;

}



/* subject row */

.row{

display:flex;

justify-content:space-between;

align-items:center;

margin:6px 0;

}



/* subject */

.sub{

width:60%;

}



/* buttons */

.btns{

display:flex;

gap:6px;

}



button{

border:none;

cursor:pointer;

}



/* P button */

.p{

width:32px;

height:32px;

border-radius:50%;

background:#16a34a;

color:white;

}



/* A button */

.a{

width:32px;

height:32px;

border-radius:50%;

background:#dc2626;

color:white;

}



/* selected */

.active{

border:3px solid white;

transform:scale(1.1);

}



/* update */

.update{

margin-top:10px;

padding:12px;

border:none;

border-radius:25px;

cursor:pointer;

background:

linear-gradient(
120deg,
#8b5cf6,
#a855f7,
#7c3aed
);

color:white;

}

</style>



</head>



<body>



<div class="container">



<div class="header">

FROM

<input type="date" id="from">


TO

<input type="date" id="to">


<button onclick="loadDates()">

Load

</button>

</div>



<div id="list" class="list"></div>



<button class="update"

onclick="updateServer()">

Update Server

</button>



</div>



</body>

</html>
